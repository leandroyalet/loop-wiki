# Static site build: Quartz is fetched as tooling by .site/build.sh (no Node project in this repo).
[build]
  command = "bash .site/build.sh"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Keep the Quartz checkout and its plugins between deploys (cold install is ~5-9 min).
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".quartz-build"]
